<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9c5d1">
<title>Ôn thi giữa kỳ</title>
<!--
=====================================================================
  WEBSITE ÔN THI GIỮA KỲ  –  1 file HTML (CSS + JavaScript tích hợp)
  Bài thực hành Tin học 12
=====================================================================
  CẤU TRÚC FILE (tìm các mốc "[PHẦN n]" bằng chức năng tìm kiếm):
    [PHẦN 1] CSS        – giao diện hồng phấn / kem. Đổi màu ở :root
    [PHẦN 2] HTML       – khung trang, thanh điều hướng, hướng dẫn
    [PHẦN 3] JavaScript – chia thành các khối nhỏ:
        3.1 Cấu hình (danh sách môn học, khóa lưu trữ)
        3.2 Hàm tiện ích
        3.3 Dữ liệu & lưu trữ (localStorage)
        3.4 Bộ phân tích câu hỏi dán từ văn bản
        3.5 Trang chủ + đếm ngược ngày thi
        3.6 Luyện tập / Kiểm tra / Luyện lại câu sai
        3.7 Ngân hàng câu hỏi (tìm kiếm, lọc, sửa, xóa)
        3.8 Thống kê tiến độ
        3.9 Nhập câu hỏi, Sao lưu, Đồng bộ, Hướng dẫn
        3.10 Khởi động
  Mẹo sửa: những chỗ có chữ [SỬA] là nơi học sinh có thể tự thay đổi.
=====================================================================
-->
<style>
/* =================== [PHẦN 1] CSS =================== */

/* [SỬA] Đổi bảng màu tại đây: chỉ cần thay mã màu, cả trang sẽ đổi theo */
:root{
  --kem:#fff8ee;        /* nền chính (kem) */
  --kem2:#fdeedd;       /* nền phụ (kem đậm) */
  --hong:#f9c5d1;       /* hồng phấn */
  --hong2:#fde3ea;      /* hồng rất nhạt */
  --hong-d:#e8798f;     /* hồng đậm (nút) */
  --hong-dd:#c94a69;    /* hồng đậm nhất (chữ nhấn) */
  --chu:#4a2f3a;        /* màu chữ chính */
  --chu2:#8a6670;       /* màu chữ phụ */
  --vien:#f0d9d2;       /* màu viền */
  --ok:#3f9d78;         /* đúng */
  --ok-bg:#e3f5ec;
  --bad:#d6455f;        /* sai */
  --bad-bg:#fde6ea;
  --sao:#f2a900;        /* ngôi sao câu khó */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--kem);color:var(--chu);line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
header.top{position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--hong),#fbd9c9);box-shadow:0 2px 10px rgba(201,74,105,.18)}
header.top h1{font-size:1.1rem;margin:0;color:var(--chu)}
header.top small{color:var(--chu2)}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
.page{display:none}.page.active{display:block}

/* Thanh điều hướng dưới cùng (dễ bấm bằng ngón cái) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;
  border-top:1px solid var(--vien);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:7px 2px 5px;font-size:.7rem;color:var(--chu2);min-height:56px;font-family:inherit}
nav.bottom button .ic{display:block;font-size:1.3rem;line-height:1.2}
nav.bottom button.active{color:var(--hong-dd);font-weight:700;background:var(--hong2)}

.card{background:#fff;border:1px solid var(--vien);border-radius:16px;padding:14px;margin-bottom:12px;
  box-shadow:0 2px 8px rgba(232,121,143,.08)}
.card h2,.card h3{margin:0 0 8px;font-size:1.05rem}
.muted{color:var(--chu2);font-size:.88rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Nút bấm: cao tối thiểu 44px để dễ chạm trên điện thoại */
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:44px;font-size:1rem;font-family:inherit;
  background:var(--hong-d);color:#fff;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.block{display:block;width:100%}
.btn.ghost{background:var(--hong2);color:var(--hong-dd)}
.btn.line{background:#fff;color:var(--hong-dd);border:1.5px solid var(--hong)}
.btn.danger{background:var(--bad)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.on{background:#fff3cf;color:#9a6a00;border:1.5px solid var(--sao)}
.btn:disabled{opacity:.5}

input,select,textarea{width:100%;font-size:1rem;font-family:inherit;color:var(--chu);background:var(--kem);
  border:1.5px solid var(--vien);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--hong-d);border-color:var(--hong-d)}
label.f{display:block;font-size:.85rem;color:var(--chu2);margin:8px 0 3px;font-weight:600}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--hong-d)}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.95rem}

.tag{display:inline-block;background:var(--hong2);color:var(--hong-dd);border-radius:20px;padding:1px 10px;font-size:.75rem;margin:1px 3px 1px 0}
.tag.star{background:#fff3cf;color:#9a6a00}.tag.wr{background:var(--bad-bg);color:var(--bad)}
.big{font-size:2.2rem;font-weight:800;color:var(--hong-dd);line-height:1.1}
.stat{background:var(--hong2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--hong-dd)}
.stat span{font-size:.75rem;color:var(--chu2)}
.bar{height:10px;background:var(--kem2);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hong),var(--hong-d))}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;border:1.5px solid var(--hong);background:#fff;color:var(--hong-dd);border-radius:20px;padding:8px 14px;font-size:.9rem;font-family:inherit;min-height:40px}
.tabs button.active{background:var(--hong-d);color:#fff;border-color:var(--hong-d)}

/* Phần làm bài */
.sess-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.timer{font-weight:700;color:var(--hong-dd);font-variant-numeric:tabular-nums}
.pbar{height:6px;background:var(--kem2);border-radius:6px;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--hong-d);transition:width .2s}
.qmeta{font-size:.78rem;color:var(--chu2);margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--kem);color:var(--chu);
  border:1.5px solid var(--vien);border-radius:12px;padding:12px;font-size:1rem;font-family:inherit;min-height:48px}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hong);color:var(--hong-dd);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.opt.sel{border-color:var(--hong-d);background:var(--hong2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .ltr{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .ltr{background:var(--bad);color:#fff}
.fb{padding:10px 12px;border-radius:10px;margin-top:12px;font-weight:700}
.fb.okbox{background:var(--ok-bg);color:var(--ok)}.fb.badbox{background:var(--bad-bg);color:var(--bad)}
.explain{margin-top:8px;padding:10px 12px;background:#fffbe9;border-left:4px solid var(--sao);border-radius:8px;white-space:pre-wrap;font-size:.95rem}
.navrow{display:flex;gap:8px;margin-top:12px}.navrow .btn{flex:1}
.qgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.qgrid button{min-height:40px;border:1.5px solid var(--vien);background:#fff;border-radius:10px;font-family:inherit;font-size:.9rem}
.qgrid button.done{background:var(--hong);border-color:var(--hong-d)}
.qgrid button.cur{outline:2px solid var(--hong-dd)}

/* Ngân hàng câu hỏi */
.qi-head{cursor:pointer}.qi-text{font-weight:600;white-space:pre-wrap}
.qi-body{margin-top:8px;border-top:1px dashed var(--vien);padding-top:8px;font-size:.93rem}
.qi-body .a{color:var(--ok);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bars div{flex:1;text-align:center;font-size:.7rem;color:var(--chu2)}
.bars i{display:block;width:100%;background:var(--hong-d);border-radius:6px 6px 0 0;min-height:2px}

/* Hộp thoại sửa câu hỏi và thông báo nhỏ */
.modal{position:fixed;inset:0;background:rgba(74,47,58,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:var(--kem);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--chu);color:#fff;padding:10px 16px;
  border-radius:20px;font-size:.9rem;z-index:60;display:none;max-width:90vw;text-align:center}
pre{background:#fff;border:1px solid var(--vien);border-radius:10px;padding:10px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-word}
details{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:10px 12px;margin-bottom:8px}
details summary{font-weight:700;color:var(--hong-dd);cursor:pointer;min-height:28px}
details p,details li{font-size:.93rem}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t td,table.t th{border:1px solid var(--vien);padding:6px;text-align:left;vertical-align:top}
.warn{background:#fff3cf;border-radius:10px;padding:10px;font-size:.9rem}
</style>
</head>

<!-- =================== [PHẦN 2] HTML: khung trang =================== -->
<header class="top">
  <div style="font-size:1.6rem">🌸</div>
  <div><h1>Ôn thi giữa kỳ</h1><small id="hdr-sub">Học đều mỗi ngày nhé!</small></div>
</header>

<main>
  <section id="page-home" class="page"></section>
  <section id="page-study" class="page"></section>
  <section id="page-bank" class="page"></section>
  <section id="page-stats" class="page"></section>
  <section id="page-tools" class="page"></section>
</main>

<!-- Thanh điều hướng: data-p là tên trang (khớp với PAGES trong JavaScript) -->
<nav class="bottom">
  <button data-act="nav" data-p="home"><span class="ic">🏠</span>Trang chủ</button>
  <button data-act="nav" data-p="study"><span class="ic">✏️</span>Học & Thi</button>
  <button data-act="nav" data-p="bank"><span class="ic">📚</span>Ngân hàng</button>
  <button data-act="nav" data-p="stats"><span class="ic">📊</span>Thống kê</button>
  <button data-act="nav" data-p="tools"><span class="ic">⚙️</span>Thêm</button>
</nav>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Trang này cần bật JavaScript để hoạt động.</p></noscript>

<!-- Nội dung hướng dẫn: để trong thẻ template cho dễ chỉnh sửa (không cần viết trong JS) -->
<template id="tpl-guide">
  <details open><summary>1. Bắt đầu nhanh (3 bước)</summary>
    <ol>
      <li>Vào <b>Thêm → Nhập câu hỏi</b>, dán câu hỏi từ tài liệu theo mẫu (xem mục 2).</li>
      <li>Vào <b>Học & Thi</b>, chọn môn/chương/bài rồi bấm <b>Bắt đầu</b>.</li>
      <li>Cuối tuần vào <b>Thêm → Sao lưu</b> để tải file dự phòng.</li>
    </ol>
    <p class="muted">Dữ liệu tự lưu trong trình duyệt của điện thoại, không cần mạng.</p>
  </details>
  <details><summary>2. Mẫu dán câu hỏi (nhập nhiều câu một lúc)</summary>
<pre>#Môn: Tin học
#Chương: Chủ đề 4 - Cơ sở dữ liệu
#Bài: Khóa chính

Câu 1. Khóa chính của một bảng dùng để làm gì?
A. Sắp xếp bảng
B. Xác định duy nhất mỗi bản ghi
C. Xóa bản ghi
D. Đổi tên bảng
Đáp án: B
Giải thích: Khóa chính không được trùng và không được để trống.

Câu 2. Câu lệnh SQL nào lấy mọi cột của bảng HS?
A. GET * FROM HS;
B. SELECT * FROM HS;
C. SHOW HS;
D. PICK * HS;
*B
Giải thích: SELECT * FROM tên_bảng;</pre>
    <ul>
      <li>Dòng <code>#Môn:</code>, <code>#Chương:</code>, <code>#Bài:</code> áp dụng cho các câu phía dưới đến khi gặp dòng # mới.</li>
      <li>Mỗi câu bắt đầu bằng <b>Câu 1.</b> (hoặc <b>1.</b> / <b>1)</b>). Đáp án là <b>A. B. C. D.</b> (2 đến 4 đáp án).</li>
      <li>Đáp án đúng ghi bằng dòng <b>Đáp án: B</b> <u>hoặc</u> gắn dấu * trước đáp án đúng (ví dụ <code>*B. nội dung</code>).</li>
      <li><b>Giải thích:</b> không bắt buộc nhưng nên có để ôn lại.</li>
      <li>Môn không có trong danh sách (GDCD, Địa lí, ...) sẽ vào <b>Môn khác</b>.</li>
      <li>Bấm <b>Xem trước</b> để kiểm tra lỗi trước khi thêm. Câu trùng nội dung sẽ tự bị bỏ qua.</li>
      <li>Mẹo: có thể nhờ một trợ lý AI "chuyển các câu hỏi này sang đúng mẫu trên" rồi dán vào.</li>
    </ul>
  </details>
  <details><summary>3. Luyện tập, Kiểm tra, Luyện lại câu sai</summary>
    <ul>
      <li><b>Luyện tập</b>: chọn đáp án là biết đúng/sai ngay, có giải thích.</li>
      <li><b>Kiểm tra</b>: làm hết rồi mới chấm, tính điểm thang 10, có đếm giờ (đặt số phút, 0 = không giới hạn).</li>
      <li><b>Luyện lại câu sai</b>: chỉ lấy các câu từng làm sai. Làm đúng thì câu đó được gỡ khỏi danh sách câu sai.</li>
      <li><b>Trộn</b>: tick "Trộn câu hỏi" / "Trộn đáp án" để không học vẹt vị trí đáp án.</li>
      <li><b>⭐ Câu khó</b>: bấm nút sao khi đang làm hoặc trong Ngân hàng, rồi chọn nguồn "Câu khó" để ôn riêng.</li>
    </ul>
  </details>
  <details><summary>4. Sao lưu và chuyển sang máy khác</summary>
    <ul>
      <li><b>Thêm → Sao lưu → Tải file sao lưu</b> được file <code>onthi-backup-ngày.json</code>. Gửi file đó qua Zalo/Drive cho chính mình.</li>
      <li>Sang máy mới: mở trang, vào <b>Sao lưu → Khôi phục từ file</b>, chọn <b>Gộp</b> (giữ dữ liệu hiện có) hoặc <b>Thay thế</b>.</li>
      <li>Nên sao lưu mỗi tuần và trước khi xóa dữ liệu trình duyệt / cài lại máy.</li>
    </ul>
  </details>
  <details><summary>5. Cách sửa mã (dành cho bài thực hành Tin học)</summary>
    <table class="t">
      <tr><th>Muốn sửa</th><th>Tìm trong file</th></tr>
      <tr><td>Đổi màu giao diện</td><td><code>:root</code> trong [PHẦN 1], sửa các mã màu như <code>--hong</code>, <code>--kem</code></td></tr>
      <tr><td>Thêm / đổi tên môn học</td><td><code>SUBJECTS</code> trong mục 3.1</td></tr>
      <tr><td>Số câu mặc định mỗi lần luyện, số phút thi</td><td><code>studyOpts</code> (count, minutes) trong mục 3.6</td></tr>
      <tr><td>Thang điểm (10 → 100)</td><td>hàm <code>finishSession</code>, dòng tính <code>score</code></td></tr>
      <tr><td>Câu hỏi mẫu ban đầu</td><td>hằng <code>SAMPLE_TEXT</code> trong mục 3.4</td></tr>
      <tr><td>Quy tắc đọc câu hỏi dán vào</td><td>hàm <code>parseQuestions</code> (các biểu thức chính quy <code>reQ, reOpt, reAns, reExp</code>)</td></tr>
      <tr><td>Chữ hiển thị trên nút, tiêu đề</td><td>tìm chính chữ đó trong file rồi sửa</td></tr>
    </table>
    <p class="muted">Cách làm: lưu file HTML, mở bằng trình soạn thảo (ví dụ Notepad++ hoặc VS Code trên máy tính), sửa, lưu, mở lại bằng trình duyệt.</p>
  </details>
  <details><summary>6. Dùng trên Android, thêm vào màn hình chính</summary>
    <ul>
      <li>Mở file bằng Chrome. Nếu mở thẳng từ thư mục (địa chỉ bắt đầu bằng file://), dữ liệu có thể bị mất khi đổi tên/di chuyển file, nên hãy <b>sao lưu thường xuyên</b>.</li>
      <li>Cách ổn định hơn: đưa file lên một nơi lưu trang tĩnh miễn phí (GitHub Pages, Netlify, Cloudflare Pages). Khi đó có địa chỉ https, dùng Chrome → ⋮ → <b>Thêm vào màn hình chính</b>.</li>
      <li>Không dùng chế độ ẩn danh, và đừng bấm "Xóa dữ liệu trang web" của trang này.</li>
    </ul>
  </details>
</template>

<template id="tpl-sync">
  <div class="card">
    <h3>Đồng bộ trực tuyến: cần gì?</h3>
    <p>Trang này là <b>file tĩnh</b>, dữ liệu nằm trong trình duyệt của từng máy. Muốn hai thiết bị cùng thấy một dữ liệu, bắt buộc phải có <b>một nơi lưu trên Internet</b> (máy chủ) và <b>cách xác định người dùng</b> (mật khẩu hoặc đăng nhập). Nếu thiếu, ai biết địa chỉ cũng đọc/ghi được.</p>
    <table class="t">
      <tr><th>Phương án</th><th>Cần chuẩn bị</th><th>Đánh giá</th></tr>

/* cleanQ: kiểm tra và "làm sạch" 1 câu hỏi (dùng khi nhập, sửa, khôi phục file). Trả về null nếu sai. */
function cleanQ(o){
  if(!o||typeof o.text!=='string'||!Array.isArray(o.options))return null;
  let opts=o.options.map(x=>String(x==null?'':x).trim());
  while(opts.length&&!opts[opts.length-1])opts.pop();      // bỏ đáp án trống ở cuối
  if(opts.length<2||opts.length>4||opts.some(x=>!x))return null;
  const ans=parseInt(o.answer,10);
  if(!(ans>=0&&ans<opts.length))return null;
  if(!o.text.trim())return null;
  return {id:o.id||uid(),subject:o.subject||'Môn khác',chapter:(o.chapter||'Chung').trim()||'Chung',lesson:(o.lesson||'').trim(),
    text:o.text.trim(),options:opts,answer:ans,explain:String(o.explain||'').trim(),
    hard:!!o.hard,wrong:!!o.wrong,right:o.right|0,wrongCount:o.wrongCount|0,last:o.last|0};
}
function normalizeDb(d){

  base.questions=(Array.isArray(d.questions)?d.questions:[]).map(cleanQ).filter(Boolean);

}

const qKey=q=>fold(q.subject)+'|'+fold(q.text).replace(/\s+/g,' ');

/* matchSubject: đoán môn học từ chữ người dùng gõ ở dòng #Môn */
function matchSubject(s){
  const f=fold(s);
  const m=SUBJECTS.find(x=>fold(x.id)===f)||SUBJECTS.find(x=>f&&(fold(x.id).indexOf(f)>=0||f.indexOf(fold(x.id))>=0));
  return m?m.id:'Môn khác';
}
/* parseQuestions: đọc văn bản -> {out: danh sách câu hợp lệ, errs: danh sách lỗi}
   Đọc từng dòng, dùng "chế độ" mode để biết dòng thường đang thuộc phần nào:
   'q' = đề bài, 'opt' = đáp án, 'ans' = đã có dòng Đáp án, 'exp' = giải thích */
function parseQuestions(raw,def){
  const lines=String(raw).replace(/\r/g,'').split('\n');
  const out=[],errs=[];
  const ctx={subject:def.subject||'Môn khác',chapter:def.chapter||'Chung',lesson:def.lesson||''};
  let cur=null,mode='',seen=0;
  /* [SỬA] Các mẫu nhận dạng dòng (biểu thức chính quy). Muốn đổi cách gõ thì sửa ở đây */
  const reHead=/^\s*#\s*(môn|mon|chương|chuong|bài|bai)\s*[:：]\s*(.*)$/i;
  const reQ=/^\s*(?:câu(?:\s*hỏi)?|cau(?:\s*hoi)?)?\s*(\d{1,4})\s*[.):：]\s*(.*)$/i;
  const reOpt=/^\s*(\*?)\s*([A-Da-d])\s*[.):]\s*(.*)$/;
  const reAns=/^\s*(?:đáp án|dap an|đ\/a|đáp số|answer|ans)\s*(?:đúng)?\s*[:：.\-]?\s*([A-Da-d])\b/i;
  const reExp=/^\s*(?:giải thích|lời giải|hướng dẫn giải|giai thich|explain|explanation)\s*[:：]\s*(.*)$/i;

  function flush(){
    if(!cur)return;
    const label='Câu '+cur.no+' ("'+trunc(cur.text.replace(/\s+/g,' '),28)+'")';
    if(!cur.text.trim())errs.push(label+': thiếu nội dung câu hỏi');
    else if(cur.opts.length<2)errs.push(label+': cần ít nhất 2 đáp án A, B');
    else if(cur.opts.length>4)errs.push(label+': tối đa 4 đáp án A-D');
    else if(cur.ans<0||cur.ans>=cur.opts.length)errs.push(label+': thiếu hoặc sai dòng "Đáp án:"');
    else{
      const q=cleanQ({subject:cur.subject,chapter:cur.chapter,lesson:cur.lesson,text:cur.text,options:cur.opts,answer:cur.ans,explain:cur.explain});
      if(q)out.push(q);else errs.push(label+': dữ liệu không hợp lệ');
    }
    cur=null;mode='';
  }
  function start(no,text){
    seen++;
    cur={no:no||seen,text:text||'',opts:[],ans:-1,explain:'',subject:ctx.subject,chapter:ctx.chapter,lesson:ctx.lesson};
    mode='q';
  }
  lines.forEach(line=>{
    if(!line.trim())return;                                   // bỏ dòng trống
    let m=line.match(reHead);
    if(m){                                                    // dòng #Môn / #Chương / #Bài
      flush();const k=fold(m[1]),v=m[2].trim();
      if(k==='mon')ctx.subject=matchSubject(v);
      else if(k==='chuong'){ctx.chapter=v||'Chung';ctx.lesson='';}
      else ctx.lesson=v;
      return;
    }
    /* Trong phần giải thích, "1." hay "A." chỉ là chữ thường; chỉ dòng bắt đầu bằng chữ "Câu" mới mở câu mới */
    if(mode!=='exp'||!cur||/^\s*(?:câu|cau)/i.test(line)){
      m=line.match(reQ);
      if(m){flush();start(m[1],m[2]);return;}                 // dòng "Câu n."
    }
    m=cur&&mode!=='exp'?line.match(/^\s*\*\s*([A-Da-d])\s*$/):null;
    if(m){cur.ans='ABCD'.indexOf(m[1].toUpperCase());mode='ans';return;}   // dòng chỉ ghi "*B" = đáp án đúng
    if(cur&&mode!=='exp'){
      m=line.match(reOpt);
      if(m){                                                  // dòng đáp án A/B/C/D
        cur.opts.push(m[3]);mode='opt';
        if(m[1]==='*')cur.ans=cur.opts.length-1;              // dấu * = đáp án đúng
        return;
      }
    }
    if(cur){
      m=line.match(reAns);
      if(m){cur.ans='ABCD'.indexOf(m[1].toUpperCase());mode='ans';return;}
      m=line.match(reExp);
      if(m){cur.explain=m[1];mode='exp';return;}
    }
    // dòng chữ thường: nối vào phần đang viết dở
    if(!cur){start(null,line);return;}
    if(mode==='q')cur.text+='\n'+line;
    else if(mode==='opt')cur.opts[cur.opts.length-1]+=' '+line.trim();
    else if(mode==='exp')cur.explain+='\n'+line;
    else if(mode==='ans'){flush();start(null,line);}          // câu mới không đánh số
  });
  flush();
  return {out:out,errs:errs};
}

function daysLeft(dateStr){
  if(!dateStr)return null;
  const a=dateStr.split('-').map(Number);
  const t=new Date(a[0],a[1]-1,a[2]),n=new Date();
  const t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((t-t0)/86400000);
}
function renderHome(){
  const s=db.settings,total=db.questions.length;
  const wrong=db.questions.filter(q=>q.wrong).length,hard=db.questions.filter(q=>q.hard).length;
  const unseen=db.questions.filter(q=>!q.last).length;
  const td=db.daily[todayStr()]||{done:0,correct:0};
  const dl=daysLeft(s.examDate);
  let cd='<p class="muted">Chọn ngày thi để bắt đầu đếm ngược.</p>',advice='';
  if(dl!==null){
    if(dl>0){
      cd='<div class="big">'+dl+' <span style="font-size:1rem">ngày nữa</span></div>';
      const need=Math.ceil((wrong+unseen)/dl);
      advice=need>0?'<p class="muted">Gợi ý: còn '+(wrong+unseen)+' câu chưa làm/đang sai, mỗi ngày làm khoảng <b>'+need+' câu</b> là kịp.</p>':'<p class="muted">Bạn đã làm hết câu trong ngân hàng. Hãy ôn câu khó!</p>';
    }else if(dl===0){cd='<div class="big">Hôm nay thi! 🍀</div>';}
    else cd='<div class="big" style="font-size:1.3rem">Kỳ thi đã qua '+(-dl)+' ngày</div>';
  }
  const last=s.lastBackup?Math.floor((Date.now()-s.lastBackup)/86400000):null;
  const bk=(total>0&&(last===null||last>=7))?'<div class="warn" style="margin-bottom:12px">💾 '+(last===null?'Bạn chưa sao lưu lần nào.':'Đã '+last+' ngày chưa sao lưu.')+' <a href="#tools" data-act="go" data-p="tools" data-tab="backup">Sao lưu ngay</a></div>':'';
  $('#page-home').innerHTML=bk+
  '<div class="card"><h3>⏳ Đếm ngược ngày thi</h3>'+cd+advice+
    '<div class="grid2"><div><label class="f">Tên kỳ thi</label><input id="ex-name" value="'+esc(s.examName)+'" data-change="exam"></div>'+
    '<div><label class="f">Ngày thi</label><input id="ex-date" type="date" value="'+esc(s.examDate)+'" data-change="exam"></div></div></div>'+
  '<div class="grid3" style="margin-bottom:12px">'+
    '<div class="stat"><b>'+total+'</b><span>Câu hỏi</span></div>'+
    '<div class="stat"><b>'+wrong+'</b><span>Câu sai</span></div>'+
    '<div class="stat"><b>'+hard+'</b><span>Câu khó ⭐</span></div></div>'+
  '<div class="card"><h3>🌷 Hôm nay</h3><p style="margin:0">Đã làm <b>'+td.done+'</b> câu, đúng <b>'+td.correct+'</b>.</p></div>'+
  '<div class="card"><h3>Bắt đầu học</h3>'+
    '<button class="btn block" data-act="go" data-p="study" data-mode="practice">✏️ Luyện tập</button>'+
    '<div class="grid2" style="margin-top:8px">'+
    '<button class="btn line" data-act="go" data-p="study" data-mode="test">📝 Làm bài kiểm tra</button>'+
    '<button class="btn line" data-act="go" data-p="study" data-mode="retry">🔁 Ôn câu sai ('+wrong+')</button></div>'+
    '<button class="btn ghost block" style="margin-top:8px" data-act="go" data-p="tools" data-tab="guide">📘 Hướng dẫn sử dụng</button></div>';
  $('#hdr-sub').textContent=dl!==null&&dl>0?'Còn '+dl+' ngày đến '+(s.examName||'kỳ thi'):'Học đều mỗi ngày nhé!';
}

/* ---------- 3.6 LUYỆN TẬP / KIỂM TRA / LUYỆN LẠI CÂU SAI ---------- */
function filterPool(o){
  const src=o.mode==='retry'?'wrong':o.source;
  return db.questions.filter(q=>(!o.subject||q.subject===o.subject)&&(!o.chapter||q.chapter===o.chapter)&&
    (!o.lesson||q.lesson===o.lesson)&&(src==='all'||(src==='new'&&!q.last)||(src==='wrong'&&q.wrong)||(src==='hard'&&q.hard)));
}
function renderStudy(){
  if(session){renderSession();return;}
  const o=studyOpts,avail=filterPool(o).length;
  $('#page-study').innerHTML=
  '<div class="tabs">'+['practice','test','retry'].map(m=>'<button data-act="mode" data-m="'+m+'" class="'+(o.mode===m?'active':'')+'">'+MODE_LABEL[m]+'</button>').join('')+'</div>'+
  '<div class="card"><label class="f">Môn học</label><select data-change="so-subject">'+subjOptions(o.subject,'Tất cả các môn')+'</select>'+
  '<label class="f">Chương</label><select data-change="so-chapter">'+listOptions(chaptersOf(o.subject),o.chapter,'Tất cả chương')+'</select>'+
  '<label class="f">Bài</label><select data-change="so-lesson">'+listOptions(lessonsOf(o.subject,o.chapter),o.lesson,'Tất cả bài')+'</select>'+
  (o.mode==='retry'?'<p class="muted">Chế độ này chỉ lấy các câu đang bị đánh dấu sai.</p>':
    '<label class="f">Nguồn câu hỏi</label><select data-change="so-source">'+Object.keys(SRC_LABEL).map(k=>'<option value="'+k+'"'+(o.source===k?' selected':'')+'>'+SRC_LABEL[k]+'</option>').join('')+'</select>')+
  '<div class="grid2"><div><label class="f">Số câu (0 = tất cả)</label><input id="o-count" type="number" inputmode="numeric" min="0" value="'+o.count+'"></div>'+
  (o.mode==='test'?'<div><label class="f">Số phút (0 = không giới hạn)</label><input id="o-min" type="number" inputmode="numeric" min="0" value="'+o.minutes+'"></div>':'<div></div>')+'</div>'+
  '<label class="chk"><input id="o-sq" type="checkbox"'+(o.sq?' checked':'')+'> Trộn thứ tự câu hỏi</label>'+
  '<label class="chk"><input id="o-so" type="checkbox"'+(o.so?' checked':'')+'> Trộn thứ tự đáp án</label>'+
  '<p class="muted">Có <b>'+avail+'</b> câu phù hợp.</p>'+
  '<button class="btn block" data-act="start"'+(avail?'':' disabled')+'>▶ Bắt đầu '+MODE_LABEL[o.mode].toLowerCase()+'</button></div>';
}
/* beginFrom: tạo "phiên làm bài" (session) từ danh sách câu hỏi */
function beginFrom(o,poolOverride){
  let pool=poolOverride||filterPool(o);
  if(!pool.length){toast('Chưa có câu hỏi phù hợp');return;}
  if(o.sq)pool=shuffle(pool);
  if(o.count>0)pool=pool.slice(0,o.count);
  session={mode:o.mode,opts:Object.assign({},o),idx:0,finished:false,showGrid:false,startedAt:Date.now(),
    limit:(o.mode==='test'&&o.minutes>0)?o.minutes*60:0,timer:null,result:null,
    items:pool.map(q=>{const idx=q.options.map((_,i)=>i);return {q:q,order:o.so?shuffle(idx):idx,picked:null,done:false};})};
  if(session.mode==='test'||session.limit){session.timer=setInterval(tick,1000);}
  renderStudy();window.scrollTo(0,0);
}
function elapsed(){return Math.floor((Date.now()-session.startedAt)/1000);}
function tick(){
  if(!session||session.finished)return;
  if(session.limit&&elapsed()>=session.limit){toast('⏰ Hết giờ! Hệ thống tự nộp bài.');finishSession();return;}
  updateTimer();
}
function updateTimer(){
  const el=$('#timer');if(!el||!session||session.mode!=='test')return;
  el.textContent='⏱ '+(session.limit?mmss(session.limit-elapsed()):mmss(elapsed()));
}
function renderSession(){
  const S=session,box=$('#page-study');
  if(S.finished){renderResult();return;}
  const it=S.items[S.idx],q=it.q,isTest=S.mode==='test',n=S.items.length;
  let h='<div class="sess-top"><button class="btn small ghost" data-act="exit">✕ Thoát</button>'+
    '<div class="grow"><b>Câu '+(S.idx+1)+'/'+n+'</b> <span class="tag">'+MODE_LABEL[S.mode]+'</span></div><div id="timer" class="timer"></div></div>'+
    '<div class="pbar"><i style="width:'+Math.round((S.idx+1)/n*100)+'%"></i></div>';
  if(S.showGrid){
    h+='<div class="card"><b>Chọn câu:</b><div class="qgrid">'+S.items.map((x,i)=>'<button data-act="jump" data-i="'+i+'" class="'+(x.picked!==null?'done ':'')+(i===S.idx?'cur':'')+'">'+(i+1)+'</button>').join('')+'</div>'+
      '<button class="btn ghost block" data-act="grid">Đóng</button></div>';
  }
  h+='<div class="card"><div class="qmeta">'+subjIcon(q.subject)+' '+esc(q.subject)+' · '+esc(q.chapter)+(q.lesson?' · '+esc(q.lesson):'')+
    (q.hard?' <span class="tag star">⭐ khó</span>':'')+(q.wrong?' <span class="tag wr">từng sai</span>':'')+'</div>'+
    '<div class="qtext">'+esc(q.text)+'</div><div class="opts">';
  it.order.forEach((oi,p)=>{
    let cls='opt';
    if(isTest){if(it.picked===oi)cls+=' sel';}
    else if(it.done){if(oi===q.answer)cls+=' ok';else if(oi===it.picked)cls+=' bad';}
    h+='<button class="'+cls+'" data-act="pick" data-oi="'+oi+'"'+((!isTest&&it.done)?' disabled':'')+'><span class="ltr">'+'ABCD'[p]+'</span><span>'+esc(q.options[oi])+'</span></button>';
  });
  h+='</div>';
  if(!isTest&&it.done){
    const ok=it.picked===q.answer;
    h+='<div class="fb '+(ok?'okbox':'badbox')+'">'+(ok?'✅ Chính xác!':'❌ Chưa đúng. Đáp án đúng: '+'ABCD'[it.order.indexOf(q.answer)])+'</div>'+
       '<div class="explain">💡 '+(q.explain?esc(q.explain):'Câu này chưa có giải thích. Bạn có thể thêm trong Ngân hàng → Sửa.')+'</div>';
  }
  h+='<div class="row" style="margin-top:10px"><button class="btn small '+(q.hard?'on':'line')+'" data-act="hard" data-id="'+q.id+'">⭐ '+(q.hard?'Đã đánh dấu khó':'Đánh dấu câu khó')+'</button></div></div>';
  const last=S.idx===n-1;
  h+='<div class="navrow"><button class="btn line" data-act="prev"'+(S.idx===0?' disabled':'')+'>◀ Trước</button>';
  if(isTest)h+='<button class="btn ghost" data-act="grid">☰ '+S.items.filter(x=>x.picked!==null).length+'/'+n+'</button>';
  h+=last?'<button class="btn" data-act="finish">'+(isTest?'Nộp bài':'Kết thúc')+'</button>':'<button class="btn" data-act="next">Tiếp ▶</button>';
  h+='</div>';
  if(isTest&&!last)h+='<button class="btn line block" style="margin-top:8px" data-act="finish">Nộp bài</button>';
  box.innerHTML=h;updateTimer();
}
function pick(oi){
  const S=session,it=S.items[S.idx];
  if(S.mode==='test'){it.picked=(it.picked===oi)?null:oi;renderSession();return;} // bấm lại để bỏ chọn
  if(it.done)return;
  it.picked=oi;it.done=true;
  recordAnswer(it.q,oi===it.q.answer,S.mode);   // luyện tập: chấm và ghi ngay
  renderSession();
}
function finishSession(){
  const S=session;if(!S||S.finished)return;
  clearInterval(S.timer);S.finished=true;
  let correct=0,answered=0;
  S.items.forEach(it=>{
    if(it.picked===null)return;
    answered++;
    const ok=it.picked===it.q.answer;if(ok)correct++;
    if(S.mode==='test')recordAnswer(it.q,ok,S.mode);   // kiểm tra: chấm tất cả khi nộp bài
  });
  const total=S.items.length;
  /* [SỬA] Thang điểm: hiện là thang 10. Muốn thang 100 thì đổi *10 thành *100 */
  const score=Math.round(correct/total*10*100)/100;
  S.result={total:total,answered:answered,correct:correct,wrong:answered-correct,skipped:total-answered,score:score,secs:elapsed()};
  if(answered>0){
    db.history.push({t:Date.now(),mode:S.mode,subject:S.opts.subject||'Tất cả môn',total:total,correct:correct,answered:answered,score:score});
    db.history=db.history.slice(-100);save();
  }
  renderStudy();
}
function renderResult(){
  const S=session,r=S.result,isTest=S.mode==='test';
  const bad=S.items.filter(it=>(it.picked!==null&&it.picked!==it.q.answer)||(isTest&&it.picked===null));
  let h='<div class="card" style="text-align:center"><div class="muted">'+MODE_LABEL[S.mode]+' · '+mmss(r.secs)+'</div>'+
    (isTest?'<div class="big">'+r.score+'<span style="font-size:1.1rem">/10</span></div>':'<div class="big">'+r.correct+'/'+r.answered+'</div>')+
    '<p style="margin:6px 0 0">Đúng <b style="color:var(--ok)">'+r.correct+'</b> · Sai <b style="color:var(--bad)">'+r.wrong+'</b> · Bỏ qua <b>'+r.skipped+'</b></p>'+
    '<p class="muted" style="margin:6px 0 0">'+(r.correct===r.total?'Tuyệt vời! 🌟':r.wrong+r.skipped>0?'Xem lại các câu bên dưới để nhớ lâu hơn nhé.':'')+'</p></div>';
  h+='<div class="grid2"><button class="btn" data-act="redo">🔁 Làm lại</button><button class="btn line" data-act="retry-bad"'+(bad.some(it=>it.picked!==null)?'':' disabled')+'>Luyện câu sai</button></div>'+
     '<button class="btn ghost block" style="margin:8px 0 14px" data-act="back-setup">← Về màn hình chọn</button>';
  if(bad.length){
    h+='<h3>Các câu cần xem lại ('+bad.length+')</h3>';
    bad.forEach(it=>{
      const q=it.q,letter=oi=>'ABCD'[it.order.indexOf(oi)];
      h+='<div class="card"><div class="qtext">'+esc(q.text)+'</div>'+
        '<p style="margin:4px 0">'+(it.picked===null?'<span class="tag wr">Chưa trả lời</span>':'Bạn chọn: <b style="color:var(--bad)">'+letter(it.picked)+'. '+esc(q.options[it.picked])+'</b>')+'</p>'+
        '<p style="margin:4px 0">Đáp án đúng: <b style="color:var(--ok)">'+letter(q.answer)+'. '+esc(q.options[q.answer])+'</b></p>'+
        '<div class="explain">💡 '+(q.explain?esc(q.explain):'Chưa có giải thích.')+'</div>'+
        '<button class="btn small '+(q.hard?'on':'line')+'" style="margin-top:8px" data-act="hard" data-id="'+q.id+'">⭐ '+(q.hard?'Đã đánh dấu khó':'Đánh dấu câu khó')+'</button></div>';
    });
  }
  $('#page-study').innerHTML=h;
}

/* ---------- 3.7 NGÂN HÀNG CÂU HỎI ---------- */
const bf={q:'',subject:'',chapter:'',lesson:'',flag:'',limit:30};
const bankOpen=new Set();
function bankFiltered(){
  const k=fold(bf.q);
  return db.questions.filter(q=>(!bf.subject||q.subject===bf.subject)&&(!bf.chapter||q.chapter===bf.chapter)&&(!bf.lesson||q.lesson===bf.lesson)&&
    (!bf.flag||(bf.flag==='hard'&&q.hard)||(bf.flag==='wrong'&&q.wrong)||(bf.flag==='new'&&!q.last))&&
    (!k||fold(q.text+' '+q.options.join(' ')+' '+q.explain+' '+q.chapter+' '+q.lesson).indexOf(k)>=0));
}
function renderBank(){
  $('#page-bank').innerHTML=
  '<div class="card"><div class="row"><input class="grow" id="b-q" placeholder="🔍 Tìm câu hỏi, từ khóa..." value="'+esc(bf.q)+'" data-input="bq">'+
  '<button class="btn" data-act="add-q">＋</button></div>'+
  '<div class="grid2" style="margin-top:8px"><select data-change="bf-subject">'+subjOptions(bf.subject,'Tất cả môn')+'</select>'+
  '<select data-change="bf-flag"><option value="">Tất cả</option><option value="hard"'+(bf.flag==='hard'?' selected':'')+'>⭐ Câu khó</option><option value="wrong"'+(bf.flag==='wrong'?' selected':'')+'>❌ Câu sai</option><option value="new"'+(bf.flag==='new'?' selected':'')+'>Chưa làm</option></select>'+
  '<select data-change="bf-chapter">'+listOptions(chaptersOf(bf.subject),bf.chapter,'Tất cả chương')+'</select>'+
  '<select data-change="bf-lesson">'+listOptions(lessonsOf(bf.subject,bf.chapter),bf.lesson,'Tất cả bài')+'</select></div></div>'+

function renderBankList(){
  const list=bankFiltered(),shown=list.slice(0,bf.limit);
  let h='<p class="muted">'+list.length+' câu'+(list.length!==db.questions.length?' (trong '+db.questions.length+')':'')+'</p>';
  if(!list.length)h+='<div class="card muted">Không có câu nào. Hãy nhập câu hỏi ở <b>Thêm → Nhập câu hỏi</b>.</div>';
  shown.forEach(q=>{
    const open=bankOpen.has(q.id);
    h+='<div class="card"><div class="qi-head" data-act="toggle" data-id="'+q.id+'"><div class="qi-text">'+esc(open?q.text:trunc(q.text,110))+'</div>'+
      '<div style="margin-top:4px"><span class="tag">'+subjIcon(q.subject)+' '+esc(q.subject)+'</span><span class="tag">'+esc(q.chapter)+'</span>'+(q.lesson?'<span class="tag">'+esc(q.lesson)+'</span>':'')+
      (q.hard?'<span class="tag star">⭐ khó</span>':'')+(q.wrong?'<span class="tag wr">sai</span>':'')+
      ((q.right||q.wrongCount)?'<span class="muted"> ✓'+(q.right|0)+' ✗'+(q.wrongCount|0)+'</span>':'')+'</div></div>';
    if(open){
      h+='<div class="qi-body">'+q.options.map((o,i)=>'<div'+(i===q.answer?' class="a"':'')+'>'+'ABCD'[i]+'. '+esc(o)+(i===q.answer?' ✔':'')+'</div>').join('')+
        (q.explain?'<div class="explain">💡 '+esc(q.explain)+'</div>':'')+
        '<div class="row" style="margin-top:8px"><button class="btn small '+(q.hard?'on':'line')+'" data-act="hard" data-id="'+q.id+'">⭐ Khó</button>'+
        '<button class="btn small ghost" data-act="edit-q" data-id="'+q.id+'">✏️ Sửa</button>'+

  $('#b-list').innerHTML=h;

  $('#modal').classList.add('show');
}
function saveEditor(id){
  const o={id:id||uid(),subject:$('#f-subject').value,chapter:$('#f-chapter').value,lesson:$('#f-lesson').value,text:$('#f-text').value,
    options:[0,1,2,3].map(i=>$('#f-o'+i).value),answer:$('#f-ans').value,explain:$('#f-exp').value};
  const c=cleanQ(o);
  if(!c){toast('Kiểm tra lại: cần nội dung, ít nhất 2 đáp án (A,B,...) và đáp án đúng phải có nội dung');return;}
  if(id){const q=db.questions.find(x=>x.id===id);Object.assign(q,c,{hard:q.hard,wrong:q.wrong,right:q.right,wrongCount:q.wrongCount,last:q.last});}
  else db.questions.push(c);
  save();$('#modal').classList.remove('show');toast('Đã lưu');route();
}

/* ---------- 3.8 THỐNG KÊ TIẾN ĐỘ ---------- */
function renderStats(){
  const qs=db.questions,total=qs.length,done=qs.filter(q=>q.last).length;
  const R=qs.reduce((a,q)=>a+(q.right|0),0),W=qs.reduce((a,q)=>a+(q.wrongCount|0),0);
  const acc=(R+W)?Math.round(R/(R+W)*100):0;
  let h='<div class="grid2" style="margin-bottom:12px"><div class="stat"><b>'+total+'</b><span>Tổng số câu</span></div><div class="stat"><b>'+done+'</b><span>Đã làm ít nhất 1 lần</span></div>'+
    '<div class="stat"><b>'+acc+'%</b><span>Tỉ lệ đúng ('+R+'/'+(R+W)+')</span></div><div class="stat"><b>'+qs.filter(q=>q.wrong).length+'</b><span>Câu sai cần ôn</span></div></div>';
  h+='<div class="card"><h3>Tiến độ từng môn</h3>';
  let any=false;
  SUBJECTS.forEach(s=>{
    const a=qs.filter(q=>q.subject===s.id);if(!a.length)return;any=true;
    const d=a.filter(q=>q.last).length,r=a.reduce((x,q)=>x+(q.right|0),0),w=a.reduce((x,q)=>x+(q.wrongCount|0),0);
    h+='<div style="margin-bottom:12px"><div class="row"><b class="grow">'+s.icon+' '+esc(s.id)+'</b><span class="muted">'+d+'/'+a.length+' câu · đúng '+((r+w)?Math.round(r/(r+w)*100):0)+'%</span></div>'+
       '<div class="bar"><i style="width:'+Math.round(d/a.length*100)+'%"></i></div></div>';
  });
  if(!any)h+='<p class="muted">Chưa có dữ liệu.</p>';
  h+='</div>';
  // biểu đồ cột 7 ngày gần nhất
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),l:pad(d.getDate())+'/'+pad(d.getMonth()+1)});}
  const mx=Math.max(1,...days.map(d=>(db.daily[d.k]||{}).done|0));
  h+='<div class="card"><h3>Số câu làm trong 7 ngày</h3><div class="bars">'+days.map(d=>{const n=(db.daily[d.k]||{}).done|0;
    return '<div><span>'+n+'</span><i style="height:'+Math.round(n/mx*60)+'px"></i>'+d.l+'</div>';}).join('')+'</div></div>';
  h+='<div class="card"><h3>Lịch sử gần đây</h3>';
  const hs=db.history.slice(-10).reverse();
  if(!hs.length)h+='<p class="muted">Chưa có bài nào.</p>';
  hs.forEach(x=>{h+='<div class="row" style="padding:6px 0;border-bottom:1px dashed var(--vien)"><div class="grow"><b>'+esc(MODE_LABEL[x.mode]||x.mode)+'</b> <span class="muted">'+esc(x.subject)+'</span><br><span class="muted">'+fmtDate(x.t)+'</span></div>'+
    '<div style="text-align:right"><b>'+x.correct+'/'+x.total+'</b>'+(x.mode==='test'?'<br><span class="tag">'+x.score+' điểm</span>':'')+'</div></div>';});
  h+='</div><button class="btn line block" data-act="reset-stats">Xóa thống kê (giữ lại câu hỏi)</button>';
  $('#page-stats').innerHTML=h;
}

/* ---------- 3.9 NHẬP CÂU HỎI, SAO LƯU, ĐỒNG BỘ, HƯỚNG DẪN ---------- */
let importText='',importDef={subject:'Tin học',chapter:'',lesson:''};
function renderTools(){
  const tabs={import:'📥 Nhập câu hỏi',backup:'💾 Sao lưu',sync:'☁️ Đồng bộ',guide:'📘 Hướng dẫn'};
  let h='<div class="tabs">'+Object.keys(tabs).map(k=>'<button data-act="tooltab" data-t="'+k+'" class="'+(toolTab===k?'active':'')+'">'+tabs[k]+'</button>').join('')+'</div>';
  if(toolTab==='import')h+=toolImport();
  else if(toolTab==='backup')h+=toolBackup();
  else if(toolTab==='sync')h+=$('#tpl-sync').innerHTML+toolSyncForm();
  else h+=$('#tpl-guide').innerHTML;
  $('#page-tools').innerHTML=h;
}
function toolImport(){
  return '<div class="card"><h3>Dán câu hỏi từ tài liệu</h3><p class="muted">Dán nhiều câu cùng lúc theo mẫu (xem mục Hướng dẫn). Có thể dùng dòng <code>#Môn:</code> <code>#Chương:</code> <code>#Bài:</code> trong nội dung, hoặc chọn mặc định bên dưới.</p>'+
  '<label class="f">Môn mặc định</label><select id="i-subject" data-change="imp-def">'+subjOptions(importDef.subject)+'</select>'+
  '<div class="grid2"><div><label class="f">Chương mặc định</label><input id="i-chapter" data-change="imp-def" value="'+esc(importDef.chapter)+'" placeholder="VD: Chương 1"></div>'+
  '<div><label class="f">Bài mặc định</label><input id="i-lesson" data-change="imp-def" value="'+esc(importDef.lesson)+'" placeholder="VD: Bài 2"></div></div>'+
  '<label class="f">Nội dung dán vào đây</label><textarea id="i-text" data-input="imp-text" style="min-height:220px" placeholder="Câu 1. ...&#10;A. ...&#10;B. ...&#10;Đáp án: A">'+esc(importText)+'</textarea>'+
  '<div class="grid2" style="margin-top:8px"><button class="btn line" data-act="imp-sample">Chèn ví dụ</button><button class="btn line" data-act="imp-paste">📋 Dán từ clipboard</button></div>'+
  '<div class="grid2" style="margin-top:8px"><button class="btn ghost" data-act="imp-preview">🔎 Xem trước</button><button class="btn" data-act="imp-add">＋ Thêm vào ngân hàng</button></div>'+
  '<div id="i-result" style="margin-top:12px"></div></div>';
}
function readImport(){
  importText=$('#i-text').value;
  importDef={subject:$('#i-subject').value,chapter:$('#i-chapter').value.trim(),lesson:$('#i-lesson').value.trim()};
  return parseQuestions(importText,importDef);
}
function toolBackup(){
  const lb=db.settings.lastBackup;
  return '<div class="card"><h3>Sao lưu</h3><p class="muted">Lần sao lưu gần nhất: <b>'+(lb?fmtDate(lb):'chưa có')+'</b>. Gồm '+db.questions.length+' câu hỏi và toàn bộ thống kê.</p>'+
  '<button class="btn block" data-act="bk-down">⬇️ Tải file sao lưu (.json)</button>'+
  '<button class="btn line block" style="margin-top:8px" data-act="bk-copy">📋 Sao chép dữ liệu vào clipboard</button></div>'+
  '<div class="card"><h3>Khôi phục</h3>'+
  '<label class="chk"><input type="radio" name="bk-mode" value="merge" checked> Gộp (giữ dữ liệu hiện có, chỉ thêm câu mới)</label>'+
  '<label class="chk"><input type="radio" name="bk-mode" value="replace"> Thay thế toàn bộ</label>'+
  '<label class="f">Chọn file sao lưu</label><input id="bk-file" type="file" accept=".json,application/json" data-change="bk-file">'+
  '<label class="f">Hoặc dán dữ liệu đã sao chép</label><textarea id="bk-text" placeholder="Dán nội dung JSON ở đây"></textarea>'+
  '<button class="btn ghost block" style="margin-top:8px" data-act="bk-paste">Khôi phục từ ô dán</button></div>'+
  '<div class="card"><h3>Xóa dữ liệu</h3><button class="btn danger block" data-act="wipe">Xóa tất cả câu hỏi và thống kê</button></div>';
}
function toolSyncForm(){
  const s=db.settings;
  return '<div class="card"><h3>Kết nối Google Apps Script (tùy chọn)</h3>'+
  '<label class="f">URL ứng dụng web (đuôi /exec)</label><input id="sy-url" value="'+esc(s.syncUrl)+'" placeholder="https://script.google.com/macros/s/.../exec">'+
  '<label class="f">Khóa (KEY)</label><input id="sy-key" value="'+esc(s.syncKey)+'" placeholder="trùng với KEY trong mã Apps Script">'+
  '<div class="grid2" style="margin-top:10px"><button class="btn" data-act="sy-up">⬆️ Tải lên</button><button class="btn line" data-act="sy-down">⬇️ Tải về & gộp</button></div>'+
  '<p id="sy-status" class="muted"></p></div>';
}
function syncUrl(){
  const s=db.settings;
  s.syncUrl=$('#sy-url').value.trim();s.syncKey=$('#sy-key').value.trim();save();
  if(!/^https:\/\//.test(s.syncUrl)){toast('Hãy nhập URL bắt đầu bằng https://');return null;}
  return s.syncUrl+(s.syncUrl.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(s.syncKey);
}
/* mergeInto: gộp dữ liệu từ file/mạng vào db hiện tại. Trả về số câu mới thêm */
function mergeInto(data){
  const d=normalizeDb(data);
  const r=addQuestions(d.questions);
  const seenT=new Set(db.history.map(x=>x.t));
  d.history.forEach(x=>{if(!seenT.has(x.t))db.history.push(x);});
  db.history.sort((a,b)=>a.t-b.t);db.history=db.history.slice(-100);
  Object.keys(d.daily).forEach(k=>{if(!db.daily[k]||db.daily[k].done<d.daily[k].done)db.daily[k]=d.daily[k];});
  save();return r.add;
}
function restore(text){
  let data;
  try{data=JSON.parse(text);}catch(e){toast('File/nội dung không phải JSON hợp lệ');return;}
  if(!data||!Array.isArray(data.questions)){toast('Không tìm thấy danh sách câu hỏi trong dữ liệu');return;}
  const mode=($('input[name=bk-mode]:checked')||{}).value||'merge';
  if(mode==='replace'){
    if(!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng dữ liệu sao lưu?'))return;
    const keep={syncUrl:db.settings.syncUrl,syncKey:db.settings.syncKey};
    db=normalizeDb(data);Object.assign(db.settings,keep);save();toast('Đã khôi phục '+db.questions.length+' câu hỏi');
  }else toast('Đã gộp, thêm '+mergeInto(data)+' câu mới');
  renderTools();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej();}catch(e){rej(e);}ta.remove();});
}

/* ---------- XỬ LÝ SỰ KIỆN (nhận mọi lần bấm qua thuộc tính data-act) ---------- */
const actions={
  nav:b=>nav(b.dataset.p),
  go:(b,e)=>{e.preventDefault();if(b.dataset.mode)studyOpts.mode=b.dataset.mode;if(b.dataset.tab)toolTab=b.dataset.tab;nav(b.dataset.p);},
  mode:b=>{studyOpts.mode=b.dataset.m;renderStudy();},
  start:()=>{
    const o=studyOpts;
    o.count=Math.max(0,parseInt($('#o-count').value,10)||0);
    if($('#o-min'))o.minutes=Math.max(0,parseInt($('#o-min').value,10)||0);
    o.sq=$('#o-sq').checked;o.so=$('#o-so').checked;beginFrom(o);
  },
  pick:b=>pick(parseInt(b.dataset.oi,10)),
  next:()=>{if(session.idx<session.items.length-1){session.idx++;session.showGrid=false;renderSession();window.scrollTo(0,0);}},
  prev:()=>{if(session.idx>0){session.idx--;session.showGrid=false;renderSession();window.scrollTo(0,0);}},
  grid:()=>{session.showGrid=!session.showGrid;renderSession();},
  jump:b=>{session.idx=parseInt(b.dataset.i,10);session.showGrid=false;renderSession();window.scrollTo(0,0);},
  finish:()=>{
    const un=session.items.filter(x=>x.picked===null).length;
    if(session.mode==='test'&&un>0&&!confirm('Còn '+un+' câu chưa trả lời. Nộp bài?'))return;
    finishSession();
  },
  exit:()=>{
    if(session.mode==='test'&&!confirm('Thoát và bỏ bài kiểm tra này? Kết quả sẽ không được lưu.')){return;}
    if(session.mode!=='test'&&session.items.some(x=>x.picked!==null)){finishSession();return;}
    clearInterval(session.timer);session=null;renderStudy();
  },
  'back-setup':()=>{clearInterval(session&&session.timer);session=null;renderStudy();},
  redo:()=>{const o=Object.assign({},session.opts);const pool=session.items.map(x=>x.q);clearInterval(session.timer);session=null;beginFrom(o,pool);},
  'retry-bad':()=>{
    const pool=session.items.filter(x=>x.picked!==null&&x.picked!==x.q.answer).map(x=>x.q);
    const o=Object.assign({},session.opts,{mode:'retry',count:0});clearInterval(session.timer);session=null;beginFrom(o,pool);
  },
  hard:b=>{const q=db.questions.find(x=>x.id===b.dataset.id);if(!q)return;q.hard=!q.hard;save();toast(q.hard?'⭐ Đã đánh dấu câu khó':'Đã bỏ đánh dấu');route();},
  toggle:b=>{const id=b.dataset.id;if(bankOpen.has(id))bankOpen.delete(id);else bankOpen.add(id);renderBankList();},
  more:()=>{bf.limit+=30;renderBankList();},
  'add-q':()=>openEditor(null),
  'edit-q':b=>openEditor(b.dataset.id),
  'del-q':b=>{if(confirm('Xóa câu hỏi này?')){db.questions=db.questions.filter(x=>x.id!==b.dataset.id);save();toast('Đã xóa');renderBank();}},
  'save-q':b=>saveEditor(b.dataset.id),
  'close-modal':()=>$('#modal').classList.remove('show'),
  'reset-stats':()=>{if(confirm('Xóa toàn bộ thống kê và danh sách câu sai/khó? Câu hỏi vẫn được giữ.')){
    db.history=[];db.daily={};db.questions.forEach(q=>{q.right=0;q.wrongCount=0;q.wrong=false;q.last=0;q.hard=false;});save();renderStats();}},
  tooltab:b=>{toolTab=b.dataset.t;renderTools();},
  'imp-sample':()=>{$('#i-text').value=SAMPLE_TEXT;importText=SAMPLE_TEXT;},
  'imp-paste':()=>{
    if(!navigator.clipboard||!navigator.clipboard.readText){toast('Máy không cho đọc clipboard, hãy nhấn giữ vào ô và chọn Dán');return;}
    navigator.clipboard.readText().then(t=>{$('#i-text').value=t;importText=t;toast('Đã dán');}).catch(()=>toast('Không đọc được clipboard, hãy nhấn giữ vào ô và chọn Dán'));
  },
  'imp-preview':()=>{
    const r=readImport(),box=$('#i-result');
    let h='<div class="'+(r.errs.length?'warn':'fb okbox')+'">Đọc được <b>'+r.out.length+'</b> câu hợp lệ'+(r.errs.length?', <b>'+r.errs.length+'</b> câu lỗi':'')+'.</div>';
    if(r.errs.length)h+='<ul>'+r.errs.slice(0,15).map(e=>'<li>'+esc(e)+'</li>').join('')+(r.errs.length>15?'<li>... và '+(r.errs.length-15)+' lỗi nữa</li>':'')+'</ul>';
    r.out.slice(0,3).forEach(q=>{h+='<div class="card" style="margin-top:8px"><div class="qmeta">'+esc(q.subject)+' · '+esc(q.chapter)+(q.lesson?' · '+esc(q.lesson):'')+'</div><b>'+esc(trunc(q.text,100))+'</b>'+
      q.options.map((o,i)=>'<div'+(i===q.answer?' style="color:var(--ok);font-weight:700"':'')+'>'+'ABCD'[i]+'. '+esc(o)+'</div>').join('')+'</div>';});
    if(r.out.length>3)h+='<p class="muted">... và '+(r.out.length-3)+' câu nữa</p>';
    box.innerHTML=h;
  },
  'imp-add':()=>{
    const r=readImport();
    if(!r.out.length){toast('Chưa có câu hợp lệ. Bấm "Xem trước" để xem lỗi');actions['imp-preview']();return;}
    const a=addQuestions(r.out);
    toast('Đã thêm '+a.add+' câu'+(a.dup?', bỏ qua '+a.dup+' câu trùng':'')+(r.errs.length?', '+r.errs.length+' câu lỗi':''));
    if(!r.errs.length){importText='';$('#i-text').value='';$('#i-result').innerHTML='';}else actions['imp-preview']();
  },
  'bk-down':()=>{
    const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='onthi-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    db.settings.lastBackup=Date.now();save();toast('Đã tải file sao lưu');renderTools();
  },
  'bk-copy':()=>{copyText(JSON.stringify(db)).then(()=>{db.settings.lastBackup=Date.now();save();toast('Đã sao chép. Hãy dán vào ghi chú/Zalo để lưu');}).catch(()=>toast('Không sao chép được, hãy dùng nút Tải file'));},
  'bk-paste':()=>restore($('#bk-text').value),
  wipe:()=>{if(confirm('Xóa TẤT CẢ câu hỏi và thống kê? Hãy sao lưu trước nếu cần.')&&confirm('Chắc chắn xóa?')){
    const keep=db.settings;db=emptyDb();db.settings=keep;save();toast('Đã xóa');route();}},
  'sy-up':()=>{
    const u=syncUrl();if(!u)return;const st=$('#sy-status');st.textContent='Đang tải lên...';
    fetch(u,{method:'POST',body:JSON.stringify(db)}).then(r=>r.text()).then(t=>{st.textContent=t.trim()==='ok'?'✅ Đã tải lên '+fmtDate(Date.now()):'Máy chủ trả lời: '+trunc(t,80);})
      .catch(()=>{st.textContent='❌ Không kết nối được. Kiểm tra URL, quyền "Bất kỳ ai", hoặc dùng sao lưu file.';});
  },
  'sy-down':()=>{
    const u=syncUrl();if(!u)return;const st=$('#sy-status');st.textContent='Đang tải về...';
    fetch(u).then(r=>r.json()).then(d=>{if(d.error){st.textContent='❌ Sai khóa (KEY)';return;}st.textContent='✅ Đã gộp, thêm '+mergeInto(d)+' câu mới';})
      .catch(()=>{st.textContent='❌ Không tải được. Kiểm tra URL/khóa hoặc dùng sao lưu file.';});
  }
};
const changes={
  exam:()=>{db.settings.examName=$('#ex-name').value.trim();db.settings.examDate=$('#ex-date').value;save();renderHome();},
  'so-subject':el=>{studyOpts.subject=el.value;studyOpts.chapter='';studyOpts.lesson='';renderStudy();},
  'so-chapter':el=>{studyOpts.chapter=el.value;studyOpts.lesson='';renderStudy();},
  'so-lesson':el=>{studyOpts.lesson=el.value;renderStudy();},
  'so-source':el=>{studyOpts.source=el.value;renderStudy();},
  'bf-subject':el=>{bf.subject=el.value;bf.chapter='';bf.lesson='';bf.limit=30;renderBank();},
  'bf-chapter':el=>{bf.chapter=el.value;bf.lesson='';bf.limit=30;renderBank();},
  'bf-lesson':el=>{bf.lesson=el.value;bf.limit=30;renderBank();},
  'bf-flag':el=>{bf.flag=el.value;bf.limit=30;renderBank();},
  'imp-def':()=>{importDef={subject:$('#i-subject').value,chapter:$('#i-chapter').value.trim(),lesson:$('#i-lesson').value.trim()};},
  'bk-file':el=>{
    const f=el.files&&el.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>restore(String(rd.result));rd.onerror=()=>toast('Không đọc được file');rd.readAsText(f);
  }
};
const inputs={
  bq:el=>{bf.q=el.value;bf.limit=30;renderBankList();},   // gõ tới đâu lọc tới đó
  'imp-text':el=>{importText=el.value;}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&actions[b.dataset.act])actions[b.dataset.act](b,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&changes[el.dataset.change])changes[el.dataset.change](el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&inputs[el.dataset.input])inputs[el.dataset.input](el,e);});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show');}); // bấm ra ngoài để đóng
window.addEventListener('hashchange',route);

/* ---------- 3.10 KHỞI ĐỘNG ---------- */
load();
route();
setInterval(()=>{if(location.hash==='#home'||!location.hash){if(!document.activeElement||document.activeElement.tagName!=='INPUT')renderHome();}},60000); // cập nhật đếm ngược mỗi phút
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){} // xin trình duyệt giữ dữ liệu lâu dài
})();
</script>
